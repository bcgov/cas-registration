# Each app sits behind a profile named after it, so a job starts only the apps it needs:
#   COMPOSE_PROFILES=registration
#   COMPOSE_PROFILES=compliance,reporting                              # compliance drives the reporting UI to seed data
#   COMPOSE_PROFILES=administration,compliance,registration,reporting  # dashboard e2e and ZAP

# Shared app config. The apps differ only by image, port and health endpoint.
x-app-environment: &app-environment
  CI: "true" # disables secure cookies and hides the dev-only mock time picker
  HOSTNAME: localhost
  NEXTAUTH_URL_INTERNAL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  API_URL: http://127.0.0.1:8000/api/
  KEYCLOAK_LOGIN_URL: ${KEYCLOAK_LOGIN_URL}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
  ENVIRONMENT: dev

x-app-healthcheck: &app-healthcheck
  interval: 10s
  start_interval: 5s
  timeout: 10s
  retries: 20
  start_period: 90s

x-app: &app
  depends_on:
    - backend
  network_mode: host

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: registration
      POSTGRES_USER: postgres
      # Generated per run by the caller, never hardcoded. This database is an ephemeral
      # container that only accepts connections from the CI runner it was started on.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set by the caller}
    volumes:
      - db:/var/lib/postgresql/data
    network_mode: host

  backend:
    image: ghcr.io/bcgov/cas-reg-backend:${GITHUB_SHA}
    environment:
      DB_USER: postgres
      DB_NAME: registration
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set by the caller}
      DB_PORT: 5432
      DB_HOST: localhost
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: localhost,0.0.0.0,127.0.0.1
      ENVIRONMENT: dev
      CI: "true"
    depends_on:
      - db
    network_mode: host
    healthcheck:
      test: curl --fail http://127.0.0.1:8000/api || exit 1
      interval: 10s
      start_interval: 5s # poll faster while migrations run so we flip healthy promptly
      timeout: 10s
      retries: 30
      start_period: 180s

  # Always started: it is the entry point every suite navigates through, not an app under test.
  dashboard:
    <<: *app
    # Use the dashboard-e2e image which has the nextjs rewrite hosts built in
    image: ghcr.io/bcgov/cas-dash-e2e-frontend:${GITHUB_SHA}
    environment:
      <<: *app-environment
      PORT: 3000
    healthcheck:
      <<: *app-healthcheck
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1

  administration:
    <<: *app
    profiles: [administration]
    image: ghcr.io/bcgov/cas-admin-frontend:${GITHUB_SHA}
    environment:
      <<: *app-environment
      PORT: 4001
    healthcheck:
      <<: *app-healthcheck
      test: wget --no-verbose --tries=1 --spider http://localhost:4001/administration/api/health || exit 1

  compliance:
    <<: *app
    profiles: [compliance]
    image: ghcr.io/bcgov/cas-compliance-frontend:${GITHUB_SHA}
    environment:
      <<: *app-environment
      PORT: 7000
    healthcheck:
      <<: *app-healthcheck
      test: wget --no-verbose --tries=1 --spider http://localhost:7000/compliance/api/health || exit 1

  registration:
    <<: *app
    profiles: [registration]
    image: ghcr.io/bcgov/cas-reg-frontend:${GITHUB_SHA}
    environment:
      <<: *app-environment
      PORT: 4000
    healthcheck:
      <<: *app-healthcheck
      test: wget --no-verbose --tries=1 --spider http://localhost:4000/registration/api/health || exit 1

  reporting:
    <<: *app
    profiles: [reporting]
    image: ghcr.io/bcgov/cas-rep-frontend:${GITHUB_SHA}
    environment:
      <<: *app-environment
      PORT: 5000
    healthcheck:
      <<: *app-healthcheck
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/reporting/api/health || exit 1

volumes:
  db:
    driver: local
