nodeLinker: node-modules
npmMinimalAgeGate: 7d

# ESLint deprecated the whole 9.x line on npm once v10 shipped, which fails
# `yarn npm audit`. This is a deprecation notice, not a CVE, and eslint is a
# devDependency that never ships.
#
# We cannot move to ESLint 10 yet: eslint-plugin-react calls context.getFilename(),
# removed in v10, so linting crashes outright.
#
# Remove this exclusion once https://github.com/jsx-eslint/eslint-plugin-react/pull/4022
# is merged and released, then bump eslint to ^10.
npmAuditExcludePackages:
  - eslint
