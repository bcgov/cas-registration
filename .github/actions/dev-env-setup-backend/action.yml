name: "Set up backend dev environment"
description: "Sets up backend development environment with Python, Poetry, and PostgreSQL"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v5
      with:
        working_directory: ./bc_obps
    - name: Setup PGDATA
      shell: bash
      run: |
        mkdir -p /home/runner/work/pgdata
        echo "PGDATA=/home/runner/work/pgdata" >> $GITHUB_ENV
    - name: Create database
      working-directory: ./bc_obps
      shell: bash
      run: |
        initdb
        make start_pg
        createuser -h /tmp -s postgres -U $(whoami)
        make create_db
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v6
      with:
        path: bc_obps/.venv
        key: venv-${{ runner.os }}-${{ hashFiles('bc_obps/.tool-versions') }}-${{ hashFiles('bc_obps/poetry.lock') }}
    #----------------------------------------------
    # install dependencies if cache does not exist
    #----------------------------------------------
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: POETRY_VIRTUALENVS_IN_PROJECT=true poetry install --no-interaction --no-root
      working-directory: ./bc_obps
      shell: bash
