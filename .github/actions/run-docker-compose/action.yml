name: "Local BCIERS app run"
description: "Runs the BCIERS stack locally using Docker Compose"

inputs:
  compose_profiles:
    description: "Comma separated docker compose profiles naming the apps to start, e.g. 'registration' or 'compliance,reporting'. db, backend and dashboard always start. See bciers/docker-compose.yaml."
    required: true
  django_secret_key:
    description: "Django secret key"
    required: true
  keycloak_client_id:
    description: "Identifier for keycloak dev client"
    required: true
  keycloak_client_secret:
    description: "Keycloak client secret"
    required: true
  nextauth_secret:
    description: "NextAuth client secret"
    required: true

runs:
  using: composite
  steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Set environment variables
      env:
        DJANGO_SECRET_KEY: ${{ inputs.django_secret_key }}
        NEXTAUTH_SECRET: ${{ inputs.nextauth_secret }}
        KEYCLOAK_CLIENT_ID: ${{ inputs.keycloak_client_id }}
        KEYCLOAK_CLIENT_SECRET: ${{ inputs.keycloak_client_secret }}
      run: |
        echo "GITHUB_SHA=${{ github.sha }}" >> $GITHUB_ENV
        echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" >> $GITHUB_ENV
        echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> $GITHUB_ENV
        echo "KEYCLOAK_CLIENT_ID=$KEYCLOAK_CLIENT_ID" >> $GITHUB_ENV
        echo "KEYCLOAK_CLIENT_SECRET=$KEYCLOAK_CLIENT_SECRET" >> $GITHUB_ENV
        echo "NEXTAUTH_URL_INTERNAL=http://localhost:3000" >> $GITHUB_ENV
        echo "NEXTAUTH_URL=http://localhost:3000" >> $GITHUB_ENV
        echo "API_URL=http://127.0.0.1:8000/api/" >> $GITHUB_ENV
        echo "KEYCLOAK_LOGIN_URL=https://dev.loginproxy.gov.bc.ca/auth/realms/standard" >> $GITHUB_ENV
        DB_PASSWORD=$(openssl rand -hex 24)
        echo "::add-mask::$DB_PASSWORD"
        echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
      shell: bash

    - name: Start services with Docker Compose and wait for them to be ready
      working-directory: ./bciers
      env:
        COMPOSE_PROFILES: ${{ inputs.compose_profiles }}
      run: |
        docker compose up -d --wait
      shell: bash
