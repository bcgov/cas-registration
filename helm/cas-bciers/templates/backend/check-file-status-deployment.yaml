apiVersion: apps/v1
kind: Deployment
metadata:
  name: check-document-file-status
  labels: {{- include "cas-bciers.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{- include "cas-bciers.selectorLabels" . | nindent 6 }}
      component: backend-check-document-file-status
  template:
    metadata:
      labels:
{{- include "cas-bciers.selectorLabels" . | nindent 8 }}
        component: backend-check-document-file-status
    spec:
      restartPolicy: Always
      serviceAccountName: deployer
      containers:
        - name: check-document-file-status
          image: "{{ .Values.backend.image.repository }}:{{ .Values.defaultImageTag | default .Values.backend.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            {{- include "cas-bciers.backendEnvVars" . | nindent 12 }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/attachment-credentials/attachment-credentials.json"
          resources: {{ toYaml .Values.checkDocumentFileStatus.resources | nindent 12 }}
          command:
          {{- if .Values.casLoggingSidecar060.enabled }}
            # Kube-log-runner just as entrypoint, not to output logfiles
            - "${HOME}/.local/bin/kube-log-runner"
          {{- end }}
            - /usr/bin/env
            - bash
            - -c
            - |
              set -euo pipefail;
              .venv/bin/python manage.py check_document_file_status -r 0 -d 30
          volumeMounts:
          {{- if .Values.casLoggingSidecar071.enabled }}
            {{- include "vector-collector.applicationVolumeMounts" . | nindent 12 }}
          {{- end }}
            - mountPath: "/attachment-credentials"
              name: gcs-attachment-credentials
              readOnly: true
      {{- if .Values.casLoggingSidecar060.enabled }}
        {{- include "cas-logging-sidecar.containers" (dict
            "containerToSidecar" "check-document-file-status"
            "logName" (index .Values "cas-logging-sidecar-060" "logName")
            "host" (index .Values "cas-logging-sidecar-060" "host")
            "appName" "check-document-file-status") | nindent 8 }}
      {{- end }}
      {{- if .Values.casLoggingSidecar071.enabled }}
      initContainers:
        {{- include "vector-collector.container" (dict "values" {{ index .Values "cas-logging-sidecar-071" }} "appName" "check-document-file-status") | nindent 8 }}
      {{- end }}
      volumes:
      {{- if .Values.casLoggingSidecar071.enabled }}
        {{- include "vector-collector.loggingVolumes" . | nindent 8 }}
      {{- else if .Values.casLoggingSidecar060.enabled }}
        {{- include "cas-logging-sidecar.volumes" . | nindent 8 }}
      {{- end }}
        - name: gcs-attachment-credentials
          secret:
            secretName: gcp-{{ .Release.Namespace }}-bciers-attach-service-account-key
            items:
            - key: credentials.json
              path: attachment-credentials.json
