{{- if not (hasSuffix "-prod" .Release.Namespace)}}

apiVersion: batch/v1
kind: CronJob
metadata:
  name: reset-database
  labels: {{- include "cas-bciers.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
spec:
  suspend: true # This cron job is intended to be triggered manually by Airflow
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      parallelism: 1
      completions: 1
      template:
        metadata:
          labels:
{{- include "cas-bciers.labels" . | nindent 12 }}
            component: job-with-database-access
        spec:
          activeDeadlineSeconds: 180
          serviceAccountName: deployer
          containers:
            - name: reset-database
              image: postgres:16.6-alpine
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      key: user
                      name: cas-obps-postgres-pguser-postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: cas-obps-postgres-pguser-postgres
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      key: dbname
                      name: cas-obps-postgres-pguser-postgres
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      key: port
                      name: cas-obps-postgres-pguser-postgres
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      key: host
                      name: cas-obps-postgres-pguser-postgres
                - name: APP_USER
                  valueFrom:
                    secretKeyRef:
                      key: user
                      name: cas-obps-postgres-pguser-registration
              command:
                - /usr/bin/env
                - bash
                - -c
                - |
                  psql -c "
                  DO \$\$
                  begin
                      for record in (
                          select schema_name
                          from information_schema.schemata
                          where schema_name not in ('pg_catalog', 'information_schema', 'pg_toast')
                      ) loop
                          execute 'drop schema if exists ' || quote_ident(record.schema_name) || ' cascade';
                      end loop;
                  END \$\$;
                  ";

                  psql -c "create schema public;";
                  psql -c "alter schema public owner to $(APP_USER);";
                  psql -c "grant all on schema public to $(APP_USER);";
          restartPolicy: Never
{{ end }}
